repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
  - repo: local
    hooks:
      - id: bun-fix
        name: bun run fix
        entry: bun run fix
        language: system
        pass_filenames: false
        stages: [pre-commit]
