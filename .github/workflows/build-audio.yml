name: Build Audio

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "data/builtin-sentences.txt"
      - "data/builtin-words.txt"
      - "shared/data.js"
      - "scripts/pregenerate-audio.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-audio.yml"

jobs:
  build-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate built-in audio
        run: bun run build:audio

      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-audio
          path: |
            audio/
            .cache/prebuilt-audio-cache.json
          if-no-files-found: error
