<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schreibübung</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="deck">
      <header class="topbar">
        <div class="app-brand">
          <p class="app-title">Schreibübung</p>
          <p class="topbar-copy">Höre zu und prüfe danach die Lösung.</p>
        </div>
        <nav class="tabs top-tabs" aria-label="Bereiche">
          <a class="tab active" href="./" aria-current="page">Üben</a>
          <a class="tab manage-tab" href="./manage.html">Verwalten</a>
        </nav>
      </header>

      <section class="practice-view">
        <article class="practice-surface">
          <div class="step-strip" aria-hidden="true">
            <span class="step-chip"><strong>1</strong> Hören</span>
            <span class="step-chip"><strong>2</strong> Schreiben</span>
            <span class="step-chip"><strong>3</strong> Prüfen</span>
          </div>

          <div class="control-row practice-tools">
            <button
              id="play-button"
              class="icon-button play"
              type="button"
              aria-label="Satz abspielen oder pausieren"
              title="Satz abspielen oder pausieren"
            >
              <span class="button-icon" aria-hidden="true">▶</span>
              <span class="button-label">Abspielen</span>
            </button>
            <button
              id="random-button"
              class="icon-button quiet"
              type="button"
              aria-label="Anderen Satz laden"
              title="Anderen Satz laden"
            >
              <span class="button-icon" aria-hidden="true">↺</span>
              <span class="button-label">Neuer Satz</span>
            </button>
          </div>

          <div id="reveal-card" class="reveal-panel">
            <div class="reveal-head">
              <div>
                <p class="label">Prüfen</p>
                <p class="reveal-title">Lösung vergleichen</p>
              </div>
              <button
                id="reveal-button"
                class="text-action"
                type="button"
                aria-label="Lösung deutlich zeigen"
                title="Lösung deutlich zeigen"
              >
                Lösung zeigen
              </button>
            </div>
            <p id="revealed-text" class="revealed-text is-blurred"></p>
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
